<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumia 星图 · 全部核心词</title>
<style>
  :root { --bg:#070b14; --panel:#0b1220; --fg:#e8f0f8; --dim:#9fb4c8; --acc:#6fd6ff; --line:rgba(159,180,200,.18); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { flex:0 0 auto; padding:10px 18px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; }
  header h1 { margin:0; font-size:17px; letter-spacing:.04em; }
  header .sub, header .hint { color:var(--dim); font-size:12px; }
  header .sp { flex:1 1 auto; }
  .wrap { flex:1 1 auto; min-height:0; display:flex; }

  aside { flex:0 0 306px; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .pad { padding:12px 14px; }
  .lab { color:var(--dim); font-size:12px; margin:2px 0 6px; }
  input[type=search] { width:100%; background:var(--panel); border:1px solid rgba(159,180,200,.3);
                       color:var(--fg); border-radius:6px; padding:7px 9px; font:inherit; }
  input[type=search]:focus { outline:none; border-color:var(--acc); }
  button { background:var(--panel); border:1px solid rgba(159,180,200,.3); color:var(--fg);
           border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  .legend { display:flex; flex-wrap:wrap; gap:6px; }
  .legend button { font-size:12px; padding:4px 9px; }
  .legend button.on { border-color:var(--acc); color:var(--acc); background:rgba(111,214,255,.08); }

  #list { flex:1 1 auto; min-height:0; overflow:auto; border-top:1px solid var(--line); }
  #list button { display:block; width:100%; text-align:left; border:0; border-radius:0; padding:6px 14px;
                 border-bottom:1px solid rgba(159,180,200,.08); font-size:13px; }
  #list button.on { background:rgba(111,214,255,.1); }
  #list .w { font-family:ui-monospace,Consolas,monospace; }
  #list .zh { color:var(--dim); margin-left:8px; }
  #list .ct { color:var(--dim); float:right; font-size:11px; }

  #detail { flex:0 0 auto; max-height:44%; overflow:auto; padding:12px 14px; border-top:1px solid var(--line); }
  #detail .big { font-family:ui-monospace,Consolas,monospace; font-size:22px; }
  #detail .kv { color:var(--dim); font-size:12px; margin-top:3px; }
  #detail .gl { margin-top:8px; }
  #detail .src { color:var(--dim); font-size:12px; margin-top:6px; }
  #detail svg { display:block; margin:8px 0 2px; }

  #viewport { flex:1 1 auto; min-width:0; position:relative; cursor:grab; background:var(--bg); }
  #viewport.drag { cursor:grabbing; }
  #sky { display:block; width:100%; height:100%; }
  #sky g.star text { visibility:hidden; }
  #sky.lab g.star text { visibility:visible; }
  #zoombar { position:absolute; right:14px; bottom:14px; display:flex; gap:6px; align-items:center;
             background:rgba(7,11,20,.85); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  #zoombar span { min-width:48px; text-align:center; color:var(--dim); font-size:12px; }
  /* 悬停提示：跟着光标走，不吃事件（pointer-events:none），否则会挡住命中测试 */
  #tip { position:absolute; display:none; pointer-events:none; z-index:5; max-width:260px;
         background:rgba(7,11,20,.94); border:1px solid var(--line); border-radius:6px;
         padding:5px 9px; font-size:13px; }
  #tip .w { font-family:ui-monospace,Consolas,monospace; color:var(--acc); }
  #tip .zh { color:#e8f0f8; margin-left:8px; }
  #tip .src { color:var(--dim); font-size:11px; margin-top:3px; }
  .fallback { padding:24px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Lumia 星图</h1>
  <span class="sub">全部 97 个核心词 · 按词类分星区</span>
  <span class="sp"></span>
  <span class="hint">滚轮缩放 · 拖拽平移 · 悬停看词 · 点星看词条</span>
</header>

<div class="wrap">
  <aside>
    <div class="pad">
      <input id="q" type="search" placeholder="搜索词形 / 中文 / 英文…" autocomplete="off">
      <div class="lab" style="margin-top:12px">星区</div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="list"></div>
    <div id="detail"><div class="kv">点一颗星看它的词条。</div></div>
  </aside>

  <div id="viewport">
    <svg id="sky" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tip"></div>
    <div id="zoombar">
      <button id="zoomOut" title="缩小">−</button>
      <span id="zoomLbl">100%</span>
      <button id="zoomIn" title="放大">+</button>
      <button id="fit" title="缩放到全部星区">适应</button>
    </div>
  </div>
</div>

<script src="星座数据.js"></script>
<script>
(function () {
  "use strict";

  var D = window.LUMIA;
  if (!D || !D.words) {
    document.getElementById('viewport').innerHTML =
      '<p class="fallback">没能读到 <b>星座数据.js</b>。<br>请从 <code>工具/</code> 目录打开本页，' +
      '或先运行 <code>powershell -File 数据/生成星座图.ps1</code> 生成它。</p>';
    return;
  }

  /* ---------- 参数：全部来自数据库 ---------- */
  var SM   = D.starmap || {};
  var CELL = +SM.glyphCell   || 118;   // 星符在 1:1 时的显示边长
  var SP   = +SM.starSpacing || 170;   // 区内相邻两星的间距
  var RG   = +SM.regionGap   || 1500;  // 星区中心到整图中心的距离
  var LMIN = +SM.labelMinCell|| 96;    // 放大到多大才显示词形标签
  var LOP  = (SM.lineOpacity != null) ? +SM.lineOpacity : 0.22;
  var HITF = +SM.hitFactor   || 0.8;   // 可悬停/可点击的圆盘 = 星符外接半径 × 此值
  var TIPOFF = +SM.tipOffset || 16;    // 提示框相对光标的偏移

  var GLYPH = (D.glyphs && D.glyphs.word)  || {};
  var DIGIT = (D.glyphs && D.glyphs.digit) || {};
  var BOX   = (D.glyphs && D.glyphs.box)   || { word:120, digit:100 };
  var CSS   = ((D.glyphs && D.glyphs.css) || '') + (D.extraCss || '') + (SM.css || '');
  var UNIT  = CELL / (BOX.word || 120);   // 字形网格 -> 世界单位

  var VAL = {}, POW = {};
  (D.digits || []).forEach(function (d) { VAL[d.w] = d.value; });
  (D.powers || []).forEach(function (p) { POW[p.w] = p.value; });

  var CATS = (D.categories || []).map(function (c) { return { code:c.code, zh:c.zh, note:c.note }; });
  var CATZH = {};
  CATS.forEach(function (c) { CATZH[c.code] = c.zh; });

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- 一个词的「星」 ---------- */
  /* 有星符的用星符；11 个数词按设计不配星符，画成星数（数字符），
     与 数据/lumia.json 的 numerals.numeralGlyphs 说法一致。 */
  function starOf(w) {
    if (GLYPH[w]) return { body:GLYPH[w], gw:BOX.word, gh:BOX.word };
    var v = VAL[w];
    if (v != null && DIGIT[String(v)]) return { body:DIGIT[String(v)], gw:BOX.digit, gh:BOX.digit };
    var p = POW[w];
    if (p != null) {
      var s = String(p), out = [], step = BOX.digit * 0.92;
      for (var i = 0; i < s.length; i++)
        if (DIGIT[s[i]]) out.push('<g transform="translate(' + (i * step).toFixed(2) + ',0)">' + DIGIT[s[i]] + '</g>');
      if (out.length) return { body:out.join(''), gw:BOX.digit * (1 + (out.length - 1) * 0.92), gh:BOX.digit };
    }
    return null;
  }

  /* ---------- 分组：按词类分星区 ---------- */
  var groups = [], seen = {};
  CATS.forEach(function (c) {
    var ws = [];
    for (var w in D.words) if (D.words[w].cat === c.code && starOf(w)) ws.push(w);
    if (ws.length) { groups.push({ code:c.code, zh:c.zh, note:c.note, words:ws }); seen[c.code] = 1; }
  });
  var other = [];
  for (var w2 in D.words) if (!seen[D.words[w2].cat] && starOf(w2)) other.push(w2);
  if (other.length) groups.push({ code:'other', zh:'其他', words:other });

  /* 大的星区放前面，均匀落在圆周上 */
  groups.sort(function (a, b) { return b.words.length - a.words.length; });

  var GA = Math.PI * (3 - Math.sqrt(5));   // 黄金角
  var stars = [], lines = [];

  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }

  /* 最小生成树：只为聚拢视线、方便导航，不代表语义关系 */
  function mst(pts) {
    var n = pts.length, edges = [];
    if (n < 2) return edges;
    var used = new Array(n), best = new Array(n), i;
    used[0] = true;
    for (i = 1; i < n; i++) best[i] = { d:dist(pts[0], pts[i]), from:0 };
    for (var k = 1; k < n; k++) {
      var bi = -1, bd = Infinity;
      for (i = 0; i < n; i++) if (!used[i] && best[i] && best[i].d < bd) { bd = best[i].d; bi = i; }
      if (bi < 0) break;
      used[bi] = true; edges.push([best[bi].from, bi]);
      for (i = 0; i < n; i++) if (!used[i]) {
        var d = dist(pts[bi], pts[i]);
        if (!best[i] || d < best[i].d) best[i] = { d:d, from:bi };
      }
    }
    return edges;
  }

  var nR = groups.length || 1;
  groups.forEach(function (g, gi) {
    var n = g.words.length, maxR = 0;
    g.pts = g.words.map(function (w, i) {
      var rad = SP * Math.sqrt(i + 0.5), a = i * GA;
      if (rad > maxR) maxR = rad;
      return { w:w, lx:rad * Math.cos(a), ly:rad * Math.sin(a) };
    });
    g.radius = maxR;
    var ang = -Math.PI / 2 + gi * 2 * Math.PI / nR;
    g.cx = Math.cos(ang) * RG;
    g.cy = Math.sin(ang) * RG;
    g.pts.forEach(function (p) { p.x = g.cx + p.lx; p.y = g.cy + p.ly; p.cat = g.code; stars.push(p); });
    mst(g.pts).forEach(function (e) { lines.push([g.pts[e[0]], g.pts[e[1]]]); });
  });

  /* ---------- 画 ---------- */
  var sky = document.getElementById('sky');
  var o = ['<style>' + CSS + '</style>', '<g id="cam">'];

  groups.forEach(function (g) {
    o.push('<circle class="region" cx="' + g.cx.toFixed(1) + '" cy="' + g.cy.toFixed(1) +
           '" r="' + (g.radius + CELL * 0.45).toFixed(1) + '"/>');
    o.push('<text class="regname" x="' + g.cx.toFixed(1) + '" y="' +
           (g.cy - g.radius - CELL * 0.7).toFixed(1) + '">' + esc(g.zh) + '</text>');
  });

  o.push('<g class="lines" opacity="' + LOP + '">');
  lines.forEach(function (L) {
    o.push('<path class="starline" d="M' + L[0].x.toFixed(1) + ' ' + L[0].y.toFixed(1) +
           ' L' + L[1].x.toFixed(1) + ' ' + L[1].y.toFixed(1) + '"/>');
  });
  o.push('</g>');

  stars.forEach(function (p) {
    var st = starOf(p.w), info = D.words[p.w] || {};
    var bw = st.gw * UNIT, bh = st.gh * UNIT, r = Math.max(bw, bh);
    p.r = r;   // 命中测试要用：可悬停/可点击的圆盘 = r × HITF
    o.push('<g class="star" data-w="' + esc(p.w) + '" data-cat="' + esc(p.cat) + '"' +
           ' transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')">');
    o.push('<circle class="starhalo" r="' + (r * 0.62).toFixed(1) + '"/>');
    /* 星符里的点（.d）也要跟着放大：几何在 glyphs 网格上，故缩到世界单位 */
    o.push('<g transform="translate(' + (-bw / 2).toFixed(2) + ',' + (-bh / 2).toFixed(2) +
           ') scale(' + UNIT.toFixed(5) + ')">' + st.body + '</g>');
    o.push('<text class="starlabel" y="' + (bh / 2 + 26).toFixed(1) + '">' + esc(p.w) + '</text>');
    o.push('<text class="starzh" y="' + (bh / 2 + 42).toFixed(1) + '">' + esc(info.zh || '') + '</text>');
    o.push('</g>');
  });
  o.push('</g>');
  sky.innerHTML = o.join('');

  var cam = sky.querySelector('#cam');
  var view = document.getElementById('viewport');
  var zoomLbl = document.getElementById('zoomLbl');

  /* ---------- 镜头 ---------- */
  var k = 1, tx = 0, ty = 0;
  function apply() {
    cam.setAttribute('transform', 'translate(' + tx.toFixed(2) + ',' + ty.toFixed(2) + ') scale(' + k.toFixed(5) + ')');
    zoomLbl.textContent = Math.round(k * 100) + '%';
    sky.classList.toggle('lab', k * CELL >= LMIN);
  }

  var BBOX = (function () {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    groups.forEach(function (g) {
      var r = g.radius + CELL * 1.1;
      x0 = Math.min(x0, g.cx - r); x1 = Math.max(x1, g.cx + r);
      y0 = Math.min(y0, g.cy - r); y1 = Math.max(y1, g.cy + r);
    });
    return { x:x0, y:y0, w:Math.max(1, x1 - x0), h:Math.max(1, y1 - y0) };
  })();

  function fit() {
    var r = view.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var k2 = Math.min(r.width / (BBOX.w + 60), r.height / (BBOX.h + 60));
    k = k2;
    tx = (r.width - BBOX.w * k) / 2 - BBOX.x * k;
    ty = (r.height - BBOX.h * k) / 2 - BBOX.y * k;
    apply();
  }

  function zoomAt(sx, sy, f) {
    var k2 = Math.min(6, Math.max(0.04, k * f));
    tx = sx - (sx - tx) * (k2 / k);
    ty = sy - (sy - ty) * (k2 / k);
    k = k2; apply();
  }

  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
  }, { passive:false });

  var dragging = false, lx = 0, ly = 0, moved = 0;

  /* ---------- 命中测试 ---------- */
  // 悬停与点击都**不认 e.target**，而是把光标位置换算回星图坐标、再找最近的那颗星。
  // 原因：下面 pointerdown 里的 setPointerCapture 会把随后的 click 重定向到 #viewport
  // 上，e.target 于是永远不是那颗星——只按事件目标去找的写法在真实浏览器里一颗也选不中
  // （手动派发事件的垫片测试恰好绕过了这一步，所以看不出来）。
  function hitTest(clientX, clientY) {
    var r = view.getBoundingClientRect();
    var wx = (clientX - r.left - tx) / k, wy = (clientY - r.top - ty) / k;
    var best = null, bestD = Infinity;
    for (var i = 0; i < stars.length; i++) {
      var p = stars[i], dx = p.x - wx, dy = p.y - wy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= (p.r || 0) * HITF && d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  var nodeOf = {}, hovered = null, tip = document.getElementById('tip');
  (function () {
    var n = sky.querySelectorAll('g.star');
    for (var i = 0; i < n.length; i++) nodeOf[n[i].getAttribute('data-w')] = n[i];
  })();

  function setHover(p, clientX, clientY) {
    if (p !== hovered) {
      if (hovered && nodeOf[hovered.w]) nodeOf[hovered.w].classList.remove('hov');
      hovered = p;
      if (hovered && nodeOf[hovered.w]) nodeOf[hovered.w].classList.add('hov');
    }
    if (!p) { tip.style.display = 'none'; view.style.cursor = ''; return; }
    var info = D.words[p.w] || {}, r = view.getBoundingClientRect();
    tip.innerHTML = '<span class="w">' + esc(p.w) + '</span>' +
      (info.zh ? '<span class="zh">' + esc(info.zh) + '</span>' : '') +
      (info.ipa ? '<div class="src">' + esc(info.ipa) + '</div>' : '');
    tip.style.display = 'block';
    var x = clientX - r.left + TIPOFF, y = clientY - r.top + TIPOFF;
    // 贴边时翻到光标另一侧，别让提示框跑出视口
    if (x + tip.offsetWidth > r.width) x = clientX - r.left - tip.offsetWidth - TIPOFF;
    if (y + tip.offsetHeight > r.height) y = clientY - r.top - tip.offsetHeight - TIPOFF;
    tip.style.left = Math.max(0, x) + 'px';
    tip.style.top = Math.max(0, y) + 'px';
    view.style.cursor = 'pointer';
  }

  view.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
    view.classList.add('drag');
    setHover(null, 0, 0);
    if (view.setPointerCapture) try { view.setPointerCapture(e.pointerId); } catch (x) {}
  });
  view.addEventListener('pointermove', function (e) {
    if (dragging) {
      var dx = e.clientX - lx, dy = e.clientY - ly;
      moved += Math.abs(dx) + Math.abs(dy);
      tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; apply();
      return;
    }
    setHover(hitTest(e.clientX, e.clientY), e.clientX, e.clientY);
  });
  function endDrag() { dragging = false; view.classList.remove('drag'); }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  view.addEventListener('pointerleave', function () { setHover(null, 0, 0); });

  document.getElementById('zoomIn').onclick = function () {
    var r = view.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.3);
  };
  document.getElementById('zoomOut').onclick = function () {
    var r = view.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.3);
  };
  document.getElementById('fit').onclick = fit;

  /* ---------- 选中 ---------- */
  var selected = null;

  function select(w, focus) {
    selected = w;
    var i, nodes = sky.querySelectorAll('g.star');
    for (i = 0; i < nodes.length; i++)
      nodes[i].classList.toggle('sel', nodes[i].getAttribute('data-w') === w);
    var rows = document.querySelectorAll('#list button');
    for (i = 0; i < rows.length; i++)
      rows[i].classList.toggle('on', rows[i].getAttribute('data-w') === w);
    showDetail(w);
    if (focus) focusOn(w);
  }

  function focusOn(w) {
    var p = null, i;
    for (i = 0; i < stars.length; i++) if (stars[i].w === w) { p = stars[i]; break; }
    if (!p) return;
    var r = view.getBoundingClientRect();
    if (k < 0.5) { k = 0.9; }
    tx = r.width / 2 - p.x * k;
    ty = r.height / 2 - p.y * k;
    apply();
  }

  function showDetail(w) {
    var info = D.words[w] || {}, box = document.getElementById('detail');
    var st = starOf(w);
    var bits = [];
    if (st) bits.push('<svg width="86" height="86" viewBox="0 0 ' + (st.gw * 1.0) + ' ' + (st.gh * 1.0) + '">' +
      '<style>' + ((D.glyphs && D.glyphs.css) || '') + '</style>' + st.body + '</svg>');
    var kind = GLYPH[w] ? '星符' : '星数（数字符）';
    var ety = info.ety || '';
    var src = info.src ? ('　源：' + info.src) : '';
    box.innerHTML =
      '<div class="big">' + esc(w) + '</div>' +
      '<div class="kv">' + esc(CATZH[info.cat] || info.cat || '') + ' · ' + esc(info.pos || '') +
      '　' + esc(kind) + '</div>' +
      (info.ipa ? '<div class="kv">' + esc(info.ipa) + '</div>' : '') +
      bits.join('') +
      '<div class="gl">' + esc(info.zh || '') + '</div>' +
      (info.en ? '<div class="kv">' + esc(info.en) + '</div>' : '') +
      '<div class="src">' + esc(ety) + src + '</div>';
  }

  // 注意监听挂在 view（#viewport）而不是 sky 上：pointerdown 里的 setPointerCapture 会把
  // 随后的 click **重定向到 #viewport**，事件从 #viewport 开始冒泡、不经过它的子元素 sky，
  // 挂在 sky 上一次都不会触发（这正是「点星没反应」的第二层原因）。挂在 view 上则两种
  // 情况都对：被捕获时事件目标就是 view；没被捕获时事件从星元素冒泡上来也经过 view。
  // e.target 同样不可信，一律按坐标命中，与悬停共用一套逻辑。
  view.addEventListener('click', function (e) {
    if (moved > 4) return;
    var p = hitTest(e.clientX, e.clientY);
    if (p) select(p.w, false);
  });

  /* ---------- 侧栏列表与过滤 ---------- */
  var activeCat = null, query = '';
  var allWords = Object.keys(D.words);

  function visible(w) {
    if (activeCat && D.words[w].cat !== activeCat) return false;
    if (!query) return true;
    var i = D.words[w], hay = (w + ' ' + (i.zh || '') + ' ' + (i.en || '')).toLowerCase();
    return hay.indexOf(query) >= 0;
  }

  function renderList() {
    var list = document.getElementById('list'), out = [];
    allWords.forEach(function (w) {
      if (!visible(w)) return;
      var i = D.words[w];
      out.push('<button data-w="' + esc(w) + '"><span class="w">' + esc(w) + '</span>' +
               '<span class="zh">' + esc(i.zh || '') + '</span>' +
               '<span class="ct">' + esc(CATZH[i.cat] || i.cat) + '</span></button>');
    });
    list.innerHTML = out.length ? out.join('') : '<div class="pad kv" style="color:#9fb4c8">没有匹配的词。</div>';
    if (selected) {
      var rows = list.querySelectorAll('button');
      for (var n = 0; n < rows.length; n++)
        rows[n].classList.toggle('on', rows[n].getAttribute('data-w') === selected);
    }
  }

  function applyFilter() {
    var nodes = sky.querySelectorAll('g.star');
    for (var i = 0; i < nodes.length; i++) {
      var w = nodes[i].getAttribute('data-w');
      nodes[i].classList.toggle('dim', !visible(w));
    }
    renderList();
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var t = e.target;
    while (t && t.tagName !== 'BUTTON') t = t.parentNode;
    if (t && t.getAttribute('data-w')) select(t.getAttribute('data-w'), true);
  });

  document.getElementById('q').addEventListener('input', function () {
    query = this.value.trim().toLowerCase();
    applyFilter();
  });

  var legend = document.getElementById('legend');
  legend.innerHTML = '<button data-cat="" class="on">全部</button>' +
    groups.map(function (g) {
      return '<button data-cat="' + esc(g.code) + '">' + esc(g.zh) + ' <span style="opacity:.6">' +
             g.words.length + '</span></button>';
    }).join('');

  legend.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t.tagName !== 'BUTTON') t = t.parentNode;
    if (!t) return;
    var c = t.getAttribute('data-cat') || '';
    activeCat = c || null;
    var bs = legend.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', (bs[i].getAttribute('data-cat') || '') === c);
    applyFilter();
  });

  /* ---------- 启动 ---------- */
  renderList();
  fit();
  window.addEventListener('resize', function () { apply(); });
})();
</script>
</body>
</html>
