<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" width="1200" height="1360">
  <style>
    .s{fill:none;stroke:#6fd6ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:#ffd166;stroke:none}
    .halo{fill:none;stroke:#6fd6ff;stroke-width:.5;opacity:.13}
    .track{fill:none;stroke:#6fd6ff;stroke-width:.9;opacity:.34}
    .close{fill:none;stroke:#6fd6ff;stroke-width:.9;opacity:.16}
    .arc{fill:none;stroke:#6fd6ff;stroke-width:1;opacity:.27;stroke-dasharray:3 6}
    .bond{fill:none;stroke:#6fd6ff;stroke-width:.8;opacity:.24}
    .fall{fill:#9fb4c8;stroke:none;opacity:.75}
    .t{fill:#e8f0f8;font-family:sans-serif;font-size:20px;font-weight:bold}
    .sub{fill:#9fb4c8;font-family:sans-serif;font-size:13px}
    .cap{fill:#cfe0ef;font-family:sans-serif;font-size:15px;font-weight:bold}
    .capz{fill:#9fb4c8;font-family:sans-serif;font-size:13px}
    .lg{fill:#9fb4c8;font-family:sans-serif;font-size:13px}
    .an{fill:#ffd166;font-family:sans-serif;font-size:12px;text-anchor:middle}
  </style>

  <defs>
    <pattern id="sky" width="163" height="151" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="30" r="1" fill="#9fb4c8" opacity=".30"/>
      <circle cx="86" cy="14" r="1.3" fill="#9fb4c8" opacity=".20"/>
      <circle cx="52" cy="72" r=".9" fill="#9fb4c8" opacity=".26"/>
      <circle cx="131" cy="96" r="1.1" fill="#9fb4c8" opacity=".18"/>
      <circle cx="26" cy="124" r="1" fill="#9fb4c8" opacity=".24"/>
      <circle cx="109" cy="58" r=".8" fill="#9fb4c8" opacity=".24"/>
    </pattern>

    <!-- 星符：120 格，中心 (60,60) -->
    <g id="mi"><circle class="d" cx="60" cy="60" r="8"/></g>
    <g id="mira"><ellipse class="s" cx="54" cy="60" rx="26" ry="16"/><circle class="d" cx="54" cy="60" r="5"/><path class="s" d="M80 60 H100"/></g>
    <g id="e"><path class="s" d="M60 36 V84"/></g>
    <g id="kometa"><circle class="d" cx="44" cy="42" r="6"/><path class="s" d="M50 46 C66 72 88 88 112 104"/></g>
    <g id="pela"><path class="s" d="M86 60 Q50 40 36 60"/></g>
    <g id="la"><path class="s" d="M36 72 Q60 40 84 72"/></g>
    <g id="meta"><circle class="d" cx="34" cy="70" r="5"/><path class="s" d="M42 68 Q68 26 98 48"/></g>

    <!-- 数字符：100 格，中心 (50,50)　3 = tia -->
    <g id="num3"><circle class="d" cx="40" cy="38" r="4.5"/><circle class="d" cx="50" cy="50" r="4.5"/><circle class="d" cx="60" cy="62" r="4.5"/></g>
  </defs>

  <rect width="1200" height="1360" fill="#0a0e1a"/>
  <rect width="1200" height="1360" fill="url(#sky)"/>

  <!-- 句间弧轨 -->
  <path class="arc" d="M862.7 247.5 C 960 420, 290 450, 348.4 566.8"/>
  <path class="arc" d="M861.9 508.1 C 960 700, 280 730, 332.5 905.1"/>
  <path class="arc" d="M1101.2 783.5 C 1200 990, 290 1010, 342.9 1195"/>

  <!-- 句轨 -->
  <path class="track" d="M380 313.4 L520 196.6 M552.9 202.6 L631.6 340.2 M654.5 346.1 L827.9 238.7"/>
  <path class="track" d="M380 573.4 L520 456.6 M552.9 462.6 L631.6 600.2 M654.5 606.1 L827.9 498.7"/>
  <path class="close" d="M824.6 490.5 L385.4 584.5"/>
  <path class="track" d="M354.7 908.5 L460.4 754 M482 752 L601.6 871.6 M637.3 870.6 L772.7 719.4 M803 722.5 L891.5 875.3 M914 880.4 L1068.5 774.7"/>
  <path class="track" d="M364.7 1198.5 L470.4 1044 M492 1042 L611.6 1161.6 M647.3 1160.6 L782.7 1009.4 M813 1012.5 L901.5 1165.3 M924 1170.4 L1078.5 1064.7"/>

  <!-- 星位光晕 -->
  <circle class="halo" cx="360" cy="330" r="26"/><circle class="halo" cx="540" cy="180" r="26"/><circle class="halo" cx="640" cy="355" r="17"/><circle class="halo" cx="850" cy="225" r="26"/><circle class="halo" cx="866" cy="156" r="15"/>
  <circle class="halo" cx="360" cy="590" r="26"/><circle class="halo" cx="540" cy="440" r="26"/><circle class="halo" cx="640" cy="615" r="17"/><circle class="halo" cx="850" cy="485" r="26"/>
  <circle class="halo" cx="340" cy="930" r="26"/><circle class="halo" cx="470" cy="740" r="17"/><circle class="halo" cx="620" cy="890" r="26"/><circle class="halo" cx="790" cy="700" r="26"/><circle class="halo" cx="900" cy="890" r="17"/><circle class="halo" cx="1090" cy="760" r="26"/>
  <circle class="halo" cx="350" cy="1220" r="26"/><circle class="halo" cx="480" cy="1030" r="17"/><circle class="halo" cx="630" cy="1180" r="26"/><circle class="halo" cx="800" cy="990" r="26"/><circle class="halo" cx="910" cy="1180" r="17"/><circle class="halo" cx="1100" cy="1050" r="26"/>

  <!-- ══ 数词：tia 作卫星分叉 ══ -->
  <g transform="translate(335,305) scale(.417)"><use href="#mi"/></g>
  <g transform="translate(515,155) scale(.417)"><use href="#mira"/></g>
  <g transform="translate(624,339) scale(.267)" opacity=".6"><use href="#e"/></g>
  <g transform="translate(825,200) scale(.417)"><use href="#kometa"/></g>
  <g transform="translate(852.3,141.9) scale(.28)"><use href="#num3"/></g>
  <path class="bond" d="M856 199.7 L862.8 170.5"/>
  <text x="866" y="122" class="an">卫星分叉</text>
  <circle class="fall" cx="910" cy="280" r="2.5"/>

  <!-- ══ 现在 ══ -->
  <g transform="translate(335,565) scale(.417)"><use href="#mi"/></g>
  <g transform="translate(515,415) scale(.417)"><use href="#mira"/></g>
  <g transform="translate(624,599) scale(.267)" opacity=".6"><use href="#e"/></g>
  <g transform="translate(825,460) scale(.417)"><use href="#kometa"/></g>
  <circle class="fall" cx="910" cy="540" r="2.5"/>

  <!-- ══ 过去：pela la ══ -->
  <g transform="translate(315,905) scale(.417)"><use href="#pela"/></g>
  <text x="340" y="988" class="an">框架词</text>
  <g transform="translate(454,724) scale(.267)" opacity=".6"><use href="#la"/></g>
  <g transform="translate(595,865) scale(.417)"><use href="#mi"/></g>
  <g transform="translate(765,675) scale(.417)"><use href="#mira"/></g>
  <g transform="translate(884,874) scale(.267)" opacity=".6"><use href="#e"/></g>
  <g transform="translate(1065,735) scale(.417)"><use href="#kometa"/></g>
  <circle class="fall" cx="1150" cy="815" r="2.5"/>

  <!-- ══ 未来：meta la ══ -->
  <g transform="translate(325,1195) scale(.417)"><use href="#meta"/></g>
  <text x="350" y="1278" class="an">框架词</text>
  <g transform="translate(464,1014) scale(.267)" opacity=".6"><use href="#la"/></g>
  <g transform="translate(605,1155) scale(.417)"><use href="#mi"/></g>
  <g transform="translate(775,965) scale(.417)"><use href="#mira"/></g>
  <g transform="translate(894,1164) scale(.267)" opacity=".6"><use href="#e"/></g>
  <g transform="translate(1075,1025) scale(.417)"><use href="#kometa"/></g>
  <circle class="fall" cx="1160" cy="1105" r="2.5"/>

  <!-- 题名与句注 -->
  <text x="46" y="46" class="t">星座体 · 代表句式</text>
  <text x="46" y="70" class="sub">Selagrafi · Signature Sentences　天体隐喻时态 · 数词卫星</text>

  <circle cx="46" cy="235" r="2.5" fill="#6fd6ff"/>
  <text x="60" y="240" class="cap">mi mira e tia kometa.</text>
  <text x="60" y="262" class="capz">我看三颗彗星。　数词 ⇒ 卫星分叉</text>

  <circle cx="46" cy="500" r="2.5" fill="#6fd6ff"/>
  <text x="60" y="505" class="cap">mi mira e kometa.</text>
  <text x="60" y="527" class="capz">我观彗星。　现在——无框架，直接陈述</text>

  <circle cx="46" cy="840" r="2.5" fill="#6fd6ff"/>
  <text x="60" y="845" class="cap">pela la mi mira e kometa.</text>
  <text x="60" y="867" class="capz">过去我观彗星。　过去 = 星轨之尾</text>

  <circle cx="46" cy="1130" r="2.5" fill="#6fd6ff"/>
  <text x="60" y="1135" class="cap">meta la mi mira e kometa.</text>
  <text x="60" y="1157" class="capz">未来我观彗星。　未来 = 光锥之前</text>

  <!-- 图例 -->
  <path class="track" d="M56 1310 H96"/><text x="106" y="1315" class="lg">句轨</text>
  <path class="arc" d="M186 1310 H226"/><text x="236" y="1315" class="lg">弧轨</text>
  <path class="bond" d="M316 1310 H356"/><text x="366" y="1315" class="lg">卫星连线</text>
  <circle class="halo" cx="486" cy="1310" r="10"/><text x="502" y="1315" class="lg">星位光晕</text>
  <circle class="d" cx="616" cy="1310" r="4"/><text x="630" y="1315" class="lg">星点</text>
  <circle class="fall" cx="716" cy="1310" r="2.5"/><text x="730" y="1315" class="lg">落星</text>
</svg>
