<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 330 680 520" width="1360" height="1040">
  <!-- 星座生长：komo li mako, mi li miko.　SMIL 动画，浏览器打开即播放并循环 -->
  <!-- 静态渲染（不跑 SMIL）会显示完成态，便于核对布局 -->
  <style>
