  <g><text x="270" y="790" class="cap">komo li mako, mi li miko.</text><text x="270" y="814" class="capz">宇宙很大，我很小。</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.7333;1" dur="9s" repeatCount="indefinite"/></g>
